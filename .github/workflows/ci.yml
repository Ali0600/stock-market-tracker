name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; no job here writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app/ tests/ scripts/

      - name: Backend tests
        run: pytest -q

      # Node ships on the runner; the frontend tests use only node:test.
      - name: Frontend tests
        run: node --test tests/frontend/*.test.mjs
